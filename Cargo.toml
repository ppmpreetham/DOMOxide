[package]
name = "domoxide"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A Rust HTML sanitizer shaped around DOMPurify compatibility."
repository = "https://github.com/ppmpr/DOMOxide"
readme = "README.md"
keywords = ["html", "sanitize", "xss", "dompurify", "wasm"]
categories = ["web-programming", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["serde"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys"]
serde = ["dep:serde"]
js-sys = ["dep:js-sys"]

[dependencies]
html5ever = "0.39.0"
js-sys = { version = "0.3.100", optional = true }
markup5ever_rcdom = "0.39.0"
serde = { version = "1", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3.100", features = ["Window", "Document"] }

